<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ProxyStack · Fleet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400..700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F7F9; --surface:#fff; --text:#14161A; --muted:#70757E; --line:#E8EAEE;
  --accent:#5B5BD6; --accent-soft:#EDEDFB;
  --ok:#1E9E6A; --idle:#8A8F98; --warn:#C77700; --bad:#D14343; --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:'Google Sans','Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased;
  padding:32px 28px 48px; max-width:1260px; margin:0 auto; font-size:14px; line-height:1.45;
}
.muted{color:var(--muted)}
h1,h2{margin:0;font-weight:500}
h1{font-size:20px;letter-spacing:-.2px}
h2{font-size:14px;letter-spacing:.1px}
/* top */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#5B5BD6,#8B7BF0);box-shadow:0 4px 14px rgba(91,91,214,.35)}
.sub{font-size:12.5px;color:var(--muted);margin:1px 0 0}
.top-right{display:flex;align-items:center;gap:16px;font-size:12.5px}
.live{display:inline-flex;align-items:center;gap:7px;color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--idle);transition:.2s}
.live.on i{background:var(--ok);box-shadow:0 0 0 4px rgba(30,158,106,.14)}
.live.off i{background:var(--bad)}
.clock{color:var(--muted);font-variant-numeric:tabular-nums}
/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.card .k{font-size:12px;color:var(--muted);margin-bottom:8px}
.card .v{font-size:26px;font-weight:500;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.card .v small{font-size:13px;color:var(--muted);font-weight:400;margin-left:3px}
/* grid */
.grid{display:grid;grid-template-columns:1.9fr 1fr;gap:16px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:16px}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
/* table */
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:500;padding:0 10px 9px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--line);font-size:13px}
tr:last-child td{border-bottom:none}
tr:hover td{background:#FBFBFD}
.role{font-weight:500}
.role small{display:block;color:var(--muted);font-weight:400;font-size:11.5px}
/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:999px;background:#F1F2F5;color:var(--muted)}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.running{background:rgba(30,158,106,.1);color:var(--ok)}
.pill.idle{background:#F1F2F5;color:var(--idle)}
.pill.offline{background:rgba(209,67,67,.1);color:var(--bad)}
/* bars */
.bar{margin:11px 0}
.bar .row{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px}
.bar .track{height:7px;background:#F1F2F5;border-radius:999px;overflow:hidden}
.bar .fill{height:100%;border-radius:999px;transition:width .4s ease}
.f-flash{background:#5B5BD6}.f-panther{background:#7C8CF0}.f-lantern{background:#9FB2F5}.f-deadass{background:#C6CEF2}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chip{font-size:12px;background:var(--accent-soft);color:var(--accent);padding:3px 10px;border-radius:999px}
.chip.g{background:rgba(30,158,106,.1);color:var(--ok)}
/* feed */
.feed{list-style:none;margin:0;padding:0;max-height:340px;overflow:auto}
.feed li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.feed li:last-child{border-bottom:none}
.feed .t{color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 60px}
.feed .m{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;font-size:11px;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:6px;flex:0 0 auto}
</style>
</head>
<body>
  <header class="top">
    <div class="brand">
      <div class="logo"></div>
      <div><h1>ProxyStack</h1><p class="sub">Distributed proxy fleet</p></div>
    </div>
    <div class="top-right">
      <span class="live" id="conn"><i></i><span>connecting…</span></span>
      <span class="clock" id="clock">--:--:--</span>
    </div>
  </header>

  <section class="cards" id="cards"></section>

  <main class="grid">
    <section class="panel">
      <div class="panel-head"><h2>Agents</h2><span class="muted" id="agentsMeta"></span></div>
      <table>
        <thead><tr>
          <th>Role</th><th>Status</th><th>Key metric</th><th>Rate</th><th>Details</th>
        </tr></thead>
        <tbody id="agents"></tbody>
      </table>
    </section>

    <aside>
      <section class="panel">
        <div class="panel-head"><h2>Pool</h2><span class="muted" id="poolMeta"></span></div>
        <div id="pool"></div>
      </section>
      <section class="panel">
        <div class="panel-head"><h2>Activity</h2></div>
        <ul class="feed" id="feed"></ul>
      </section>
    </aside>
  </main>

<script>
const ROLES = [
  ["fetcher_a","Brimstone","fetcher"],["fetcher_b","Viper","fetcher"],
  ["t1_a","Sage","t1"],["t1_b","Sova","t1"],["t1_c","Astra","t1"],
  ["t1_d","Harbor","t1"],["t1_e","Reyna","t1"],
  ["t2_a","Raze","t2"],["t2_b","Killjoy","t2"],["t2_c","Cypher","t2"],
  ["pool","Yoru","pool"],["dashboard","Jett","dash"],["vps","Oracle","vps"],
];
const $ = s => document.querySelector(s);
const fmt = n => n==null ? "—" : (Math.abs(n)>=1000 ? (n/1000).toFixed(1)+"k" : (Math.round(n*10)/10).toString());
const ago = s => s==null ? "—" : (s<60 ? Math.round(s)+"s" : s<3600 ? Math.floor(s/60)+"m" : Math.floor(s/3600)+"h");
const sumCounters = (c, keys) => keys.reduce((a,k)=>a+(c&&c[k]||0),0);

const T1_KEYS = ["t1_pass"];                       // per-t1 throughput
const T2_KEYS = ["t2_pass_flash","t2_pass_panther","t2_pass_lantern","t2_pass_deadass"];
const FETCH_KEYS = ["raw_fetched"];

let prev = {};        // role -> {t, val(key metric), counters}
let lastActive = {};  // role -> ts of last counter change

function metricFor(type, node){
  const c = node && node.counters || {};
  if(type==="pool")  return sumCounters(c, ["picks_served"]);
  if(type==="fetcher") return sumCounters(c, FETCH_KEYS);
  if(type==="t1")    return sumCounters(c, T1_KEYS);
  if(type==="t2")    return sumCounters(c, T2_KEYS);
  if(type==="vps")   return sumCounters(c, ["picks_served"]);
  return sumCounters(c, ["promoted"]);
}

function statusFor(role, node, now){
  if(!node || node.error) return "offline";
  const age = now - (lastActive[role] || 0);
  return age > 15 ? "idle" : "running";
}

function renderCards(summary){
  const items = [
    ["Live proxies", fmt(summary.live), ""],
    ["Fresh ≤30s",   fmt(summary.fresh30), "backend"],
    ["Fresh ≤120s",  fmt(summary.fresh120), "fod-hunt"],
    ["Picks /s",     fmt(summary.picks_s), ""],
    ["Promotes /s",  fmt(summary.promoted_s), ""],
    ["Nodes online", `${summary.online}<small>/${summary.total}</small>`, ""],
  ];
  $("#cards").innerHTML = items.map(([k,v,sub])=>
    `<div class="card"><div class="k">${k}${sub?` · ${sub}`:""}</div><div class="v">${v}</div></div>`).join("");
}

function renderAgents(nodes, now, rates){
  const rows = ROLES.map(([role,name,type])=>{
    const n = nodes[role];
    const st = statusFor(role, n, now);
    const c = n && n.counters || {};
    const f = n && n.free || {};
    let key = "—", det = [];
    if(type==="pool"){ key = fmt(f.live)+" live"; det.push(`fresh30 ${fmt(f.fresh_30s)}`, `fresh120 ${fmt(f.fresh_120s)}`, `evicted ${fmt(c.evicted)}`); }
    else if(type==="fetcher"){ key = fmt(c.raw_fetched)+" raw"; det.push(`t1_pass ${fmt(c.t1_pass)}`, `t2_fail ${fmt(c.t2_fail)}`); }
    else if(type==="t1"){ key = fmt(c.t1_pass)+" pass"; det.push(`fail ${fmt(c.t1_fail)}`, `tcp_fail ${fmt(c.t1_tcp_fail)}`); }
    else if(type==="t2"){ key = fmt(sumCounters(c,T2_KEYS))+" pass"; det.push(`rej ${fmt(c.t2_rejected)}`, `fail ${fmt(c.t2_fail)}`); }
    else if(type==="vps"){ key = fmt((n&&n.paid&&n.paid.alive)||0)+" paid"; det.push(`total ${fmt((n&&n.paid&&n.paid.total)||0)}`); }
    else if(type==="dash"){ key = "—"; det.push("aggregator"); }
    const r = rates[role];
    const rate = r==null ? "—" : fmt(r);
    return `<tr>
      <td class="role">${name}<small>${role}</small></td>
      <td><span class="pill ${st}"><i></i>${st}</span></td>
      <td>${key}</td>
      <td>${rate}${r==null?"":'<span class="muted">/s</span>'}</td>
      <td class="muted">${det.join(" · ")||"—"}</td>
    </tr>`;
  }).join("");
  $("#agents").innerHTML = rows;
  const up = ROLES.filter(([role])=>statusFor(role,nodes[role],now)!=="offline").length;
  $("#agentsMeta").textContent = `${up}/${ROLES.length} reporting`;
}

function renderPool(nodes){
  const f = (nodes.pool && nodes.pool.free) || {};
  const total = Math.max(1,(f.flash||0)+(f.panther||0)+(f.lantern||0)+(f.deadass||0));
  const chips = `<div class="chips">
      <span class="chip g">fresh ≤30s ${fmt(f.fresh_30s||0)}</span>
      <span class="chip">fresh ≤120s ${fmt(f.fresh_120s||0)}</span>
    </div>`;
  const bars = [["flash","flash · <3s",f.flash],["panther","panther · 3–5s",f.panther],
                ["lantern","lantern · 5–7s",f.lantern],["deadass","deadass · 7–10s",f.deadass]];
  const html = bars.map(([c,label,v])=>`<div class="bar">
      <div class="row"><span>${label}</span><span class="muted">${fmt(v||0)}</span></div>
      <div class="track"><div class="fill f-${c}" style="width:${Math.round(100*(v||0)/total)}%"></div></div>
    </div>`).join("");
  $("#pool").innerHTML = chips + html;
  $("#poolMeta").textContent = `${fmt(f.live||0)} live`;
}

function renderFeed(nodes){
  let items = [];
  for(const role in nodes){
    const a = nodes[role] && nodes[role].activity;
    if(Array.isArray(a)) for(const e of a) items.push(e);
  }
  items.sort((x,y)=>(y.ts||0)-(x.ts||0));
  items = items.slice(0,40);
  $("#feed").innerHTML = items.length ? items.map(e=>{
    const t = new Date((e.ts||0)*1000).toTimeString().slice(0,8);
    return `<li><span class="t">${t}</span><span class="tag">${e.role||""}</span>
      <span class="m">${e.event||""}${e.detail?": "+e.detail:""}</span></li>`;
  }).join("") : `<li class="muted">no recent activity</li>`;
}

function handle(msg){
  const now = Date.now()/1000;
  const nodes = msg.nodes || {};
  const rates = {};

  ROLES.forEach(([role,name,type])=>{
    const m = metricFor(type, nodes[role]);
    const p = prev[role];
    if(p && now>p.t){
      const dv = m - p.val;
      if(dv>0){ lastActive[role]=now; rates[role]=dv/(now-p.t); }
      else if(!lastActive[role]) lastActive[role]=now;
    } else { lastActive[role]=now; }
    prev[role] = {t:now, val:m};
  });

  const f = (nodes.pool && nodes.pool.free) || {};
  const pc = (nodes.pool && nodes.pool.counters) || {};
  const pv = prev.pool, pv2 = pv && pv._prev;
  const picks_delta = (nodes.pool && nodes.pool.counters && nodes.pool.__prevPicks!=null)
      ? pc.picks_served - nodes.pool.__prevPicks : null;

  // compute picks/s + promoted/s from last snapshot
  let picks_s = 0, promoted_s = 0;
  if(window._prev && window._prev.t < now){
    const dt = now - window._prev.t;
    picks_s    = Math.max(0,((pc.picks_served||0)-(window._prev.picks||0))/dt);
    promoted_s = Math.max(0,((pc.promoted||0)-(window._prev.promoted||0))/dt);
  }
  window._prev = {t:now, picks: pc.picks_served||0, promoted: pc.promoted||0};

  const summary = {
    live: f.live||0, fresh30: f.fresh_30s||0, fresh120: f.fresh_120s||0,
    picks_s, promoted_s,
    online: ROLES.filter(([role])=>statusFor(role,nodes[role],now)!=="offline").length,
    total: ROLES.length,
  };
  renderCards(summary);
  renderAgents(nodes, now, rates);
  renderPool(nodes);
  renderFeed(nodes);
}

function connect(){
  const es = new EventSource("/stream/stats");
  es.onmessage = ev => {
    try { handle(JSON.parse(ev.data)); } catch(e){}
    $("#conn").className = "live on"; $("#conn").lastElementChild.textContent = "live";
  };
  es.onerror = () => {
    $("#conn").className = "live off"; $("#conn").lastElementChild.textContent = "reconnecting…";
  };
  setInterval(()=>{ $("#clock").textContent = new Date().toTimeString().slice(0,8); }, 1000);
}

connect();
</script>
</body>
</html>
